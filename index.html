<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>헬로덕</title>
  <style>
    :root {
      --bg: #f7f7f5;
      --text-main: #1a1a1a;
      --text-sub: #6b6b6b;
      --accent: #1f4b3a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
        "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    .mark {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: var(--accent);
      margin: 0 auto 24px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.01em;
    }

    p {
      font-size: 15px;
      color: var(--text-sub);
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div>
    <div class="mark"></div>
    <h1>헬로덕(helloduck)</h1>
    <p>정상적인 헬로덕 사이트입니다.<br />현재 준비 중입니다.</p>
  </div>
</body>
</html>
